name: Change user password

# Manual-only. Changes an account's password by verifying its existing (current) password.
# Works for patients, professionals, admins, ops and super admins.
#
# Unlike reset-password.yml (which generates a random password without needing the current one),
# this workflow requires the correct existing password to authorize setting the new password.
#
# When changed, all active sessions (refresh tokens) are revoked and the event is logged.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email address"
        required: true
        type: string
      existing_password:
        description: "Current / existing password to verify"
        required: true
        type: string
      new_password:
        description: "New password (at least 8 characters)"
        required: true
        type: string
      dry_run:
        description: "Verify existing password only — change nothing"
        type: boolean
        default: false

jobs:
  change-password:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSL_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Change password
        env:
          # Passed through env, not interpolated into the script, to prevent shell injection.
          EMAIL: ${{ inputs.email }}
          EXISTING_PASSWORD: ${{ inputs.existing_password }}
          NEW_PASSWORD: ${{ inputs.new_password }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Mask passwords in the run log
          echo "::add-mask::$EXISTING_PASSWORD"
          echo "::add-mask::$NEW_PASSWORD"

          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          uv run python -m scripts.change_password "${ARGS[@]}"

