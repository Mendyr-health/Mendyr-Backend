name: Reset user password

# Manual-only. Gives each listed account a new random password (printed once in this run's
# log), signs out all of its sessions and records the reset in the activity log.
# Works for patients, professionals, admins and ops — never for super admins.
#
# The log is readable by anyone with access to this repo's Actions: share each password
# privately and ask the person to change it. See scripts/reset_password.py.

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Emails to reset, separated by commas (e.g. a@x.com, b@y.com)"
        required: true
        type: string
      dry_run:
        description: "Only check the accounts — change nothing"
        type: boolean
        default: false

jobs:
  reset-password:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSL_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Reset passwords
        env:
          # Passed through env, not interpolated into the script, so an input can't inject
          # shell commands.
          USERS: ${{ inputs.users }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          uv run python -m scripts.reset_password --users "$USERS" "${ARGS[@]}"
