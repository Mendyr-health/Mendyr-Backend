name: Delete users (purge from all tables)

# Manual-only: hard-deletes specified users and cascades through every referencing table
# (bookings, care plans, addresses, wallets, reviews, support tickets, payouts, profiles,
# device/refresh tokens, etc.).
#
# Accepts a comma-separated list of emails or user UUIDs.
# Includes a dry-run mode to inspect affected rows and test foreign key constraints
# without committing changes.
on:
  workflow_dispatch:
    inputs:
      users:
        description: "Comma-separated emails or UUIDs (e.g. user1@example.com, user2@example.com)"
        required: true
        type: string
      dry_run:
        description: "Dry-run only: check constraints and preview row counts without deleting"
        required: false
        type: boolean
        default: false

jobs:
  delete-users:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSL_REQUIRED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Execute user deletion
        run: |
          ARGS="--force"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run python -m scripts.delete_users --users "${{ inputs.users }}" $ARGS

