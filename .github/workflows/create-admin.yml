name: Create or promote admin user

# Manual-only: the only CI-triggerable way to provision an `admin` account (see
# scripts/create_admin.py — self-registration can never create one; app/schemas/auth.py
# rejects `role=admin` at signup).
#
# Two modes:
#   promote — flips an EXISTING user's role to admin. No password involved at all.
#   create  — bootstraps a brand-new admin. The password is generated inside this job and
#             printed once in the run's log — it is NOT accepted as a workflow input, since
#             GitHub does not treat workflow_dispatch inputs as secret (they aren't masked
#             and persist in the run's trigger metadata). Copy the printed password
#             immediately: anyone with read access to this repo's Actions can see this run's
#             log afterwards, same trust level as any other CI log here.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "promote an existing user, or create a brand-new admin"
        options: [promote, create]
        default: promote
      email:
        description: "Email of the user to promote / create"
        required: true
        type: string
      full_name:
        description: "Full name (required for `create` only)"
        required: false
        type: string
      phone_number:
        description: "Phone number, e.g. +919876500000 (required for `create` only)"
        required: false
        type: string

jobs:
  create-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate create-mode inputs
        if: inputs.mode == 'create'
        run: |
          if [ -z "${{ inputs.full_name }}" ] || [ -z "${{ inputs.phone_number }}" ]; then
            echo "::error::full_name and phone_number are required when mode=create"
            exit 1
          fi

      - name: Promote existing user to admin
        if: inputs.mode == 'promote'
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SSL_REQUIRED: "true"
        run: uv run python -m scripts.create_admin promote --email "${{ inputs.email }}"

      - name: Create new admin (prints a one-time generated password)
        if: inputs.mode == 'create'
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_SSL_REQUIRED: "true"
        run: |
          GENERATED_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "One-time generated password (copy it now — it will not be shown again):"
          echo "$GENERATED_PASSWORD"
          ADMIN_PASSWORD="$GENERATED_PASSWORD" uv run python -m scripts.create_admin create \
            --email "${{ inputs.email }}" \
            --phone "${{ inputs.phone_number }}" \
            --full-name "${{ inputs.full_name }}"
