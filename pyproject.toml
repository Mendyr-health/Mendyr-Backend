[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "mendyr-backend"
version = "0.1.0"
description = "Mendyr — at-home healthcare marketplace connecting patients with nurses, physiotherapists and caretakers."
requires-python = ">=3.11"

dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",
    # settings / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "phonenumbers>=8.13.0",
    # db
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    # cache / queue
    "redis>=5.2.0",
    "celery>=5.4.0",
    # security
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    # observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.17.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # integrations
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "razorpay>=1.4.2",
    "jinja2>=3.1.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-passlib",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "T20"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() default-arg pattern is intentional
    "S101",
    "S105",   # flags "bearer"/dev-only default passwords as hardcoded secrets — not secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N806"]
# SQLAlchemy 2.0 relationships reference sibling models by quoted forward-ref string
# (`Mapped["User"]`) resolved lazily by the mapper registry, not by module-level name
# lookup — ruff's F821 doesn't know that pattern and flags every one as undefined.
"app/models/*" = ["N815", "F821"]
# Uppercase computed properties here intentionally match the uppercase env-var names
# they derive from (SQLALCHEMY_DATABASE_URI from POSTGRES_*), not method-naming style.
"app/core/config.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All async tests/fixtures share one session-scoped event loop, matching the module-level
# async engine in app.db.session — a fresh per-test loop would bind asyncpg connections to
# a loop that later tests don't run on ("attached to a different loop" errors).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "alembic/*"]
